---
- name: 'Assert connection parameters is defined'
  ansible.builtin.assert:
    that: >-
      proxmox_api_password is defined or
          (
            proxmox_api_token_id is defined and
            proxmox_api_token_secret is defined
          )

- name: List existing nodes
  delegate_to: localhost
  community.proxmox.proxmox_node_info:
    api_host: "{{ proxmox_api_host }}"
    api_port: "{{ proxmox_api_port }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password | default(omit) }}"
    api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs: false
  register: proxmox_nodes

- name: 'Debug'
  ansible.builtin.debug:
    var: proxmox_nodes
